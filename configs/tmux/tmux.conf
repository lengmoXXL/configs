# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on

# Make tmux feel more responsive in terminals and editors.
set -sg escape-time 10

# Use Ctrl-Space as the tmux prefix.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Keep more scrollback history.
set -g history-limit 50000

# Use vi-style copy mode keys.
setw -g mode-keys vi
set -g set-clipboard on
set -g mode-style "fg=colour255,bg=#244b6b"

# Start windows and panes at 1 for easier keyboard selection.
set -g base-index 1
setw -g pane-base-index 1

# Keep pj project context when splitting panes.
set-hook -g after-split-window 'run-shell -b "pj-tmux-after-split #{q:#{socket_path}} #{q:#{pane_id}}"'

# Show the status bar at the top.
set -g status on
set -g status-position top
set -g status-style bg=#181818,fg=colour250
set -g status-justify left
set -g status-left ""
set -g status-right "%H:%M"
set -g window-status-separator "|"
set -g window-status-current-style bg=#1f5a24,fg=colour255,bold

# Use subtle pane borders with a clear active pane highlight.
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour245

# Improve color support in modern terminals.
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Manage tmux plugins with TPM.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Peter-McKinney/tmux-fzf-open-files-nvim'

# Initialize TPM. TPM and plugin entrypoints are shell scripts.
run-shell "$HOME/.tmux/plugins/tpm/tpm"
